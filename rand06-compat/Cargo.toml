[package]
name = "rand06-compat"
version = "0.2.0"
edition = "2024"
authors = ["TLSNotary Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tlsnotary/tlsn-utils"
description = "Compatibility wrapper between `rand_core` 0.6 and 0.10"
keywords = ["rand_core", "rand", "compat", "compatibility"]

[features]
default = ["std"]
std = ["rand_core_06/std"]

[dependencies]
rand_core = { workspace = true }
rand_core_06 = { workspace = true }

[dev-dependencies]
rand_core = { workspace = true }
rand = { workspace = true }
