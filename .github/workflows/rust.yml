name: Rust

on:
  push:
    branches: [dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_VERSION: "1.95"

jobs:
  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Use caching
        uses: Swatinem/rust-cache@v2.7.7

      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: "Test"
        # Run all tests (bins, examples, lib, integration and docs)
        # https://doc.rust-lang.org/cargo/commands/cargo-test.html#target-selection
        run: cargo test

      - name: "Check documentation"
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --all-features --workspace --examples

  rustfmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.7.7
      - name: Check formatting
        run: cargo fmt --check --all

  wasm:
    name: Build and Test web-spawn (wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nightly rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-gnu
          # Pin nightly due to rustc regression with wasm32 shared memory
          # See: https://github.com/wasm-bindgen/wasm-bindgen/issues/4727
          toolchain: "nightly-2025-09-24"
          components: rust-src

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Use caching
        uses: Swatinem/rust-cache@v2.7.7

      - name: Run tests
        run: |
          cd web-spawn
          ./run_tests.sh

  wasi_tests:
    name: "Test WASI threads under V8"
    runs-on: ubuntu-latest
    env:
      # Pin the engine so a stray wasmtime install can't change what runs.
      WASM_HARNESS_ENGINE: v8
      # wasm's libstd reports one core; cap rayon so V8 workers stay low.
      WASM_HARNESS_ENV_RAYON_NUM_THREADS: "2"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-wasip1-threads

      - name: Use caching
        uses: Swatinem/rust-cache@v2.7.7
        with:
          # Own entry: this lane builds a different target than the host jobs.
          key: wasi-tests

      - name: Install wasm-harness
        # Exact pin: a bare "0.2.1" is a caret range and may pick up 0.2.x.
        run: cargo install wasm-harness --version '=0.2.1' --locked

      # jsvu installs the V8 shell (d8) to ~/.jsvu/bin, which wasm-harness
      # searches automatically.
      - name: Install V8
        run: |
          npm install -g jsvu
          jsvu --os=linux64 --engines=v8

      # Host-only crates: websocket-relay uses tokio's net/process features,
      # test-harness adds tokio net/rt-multi-thread, and rangeset-fuzz is a
      # libFuzzer binary. web-spawn also builds here (its std fallback).
      - name: Run tests under V8
        run: >
          cargo test --workspace
          --exclude websocket-relay
          --exclude test-harness
          --exclude rangeset-fuzz
          --target wasm32-wasip1-threads
          --no-fail-fast
