name: Release

on:
  push:
    tags:
      - "serio-v*"
      - "rangeset-v*"
      - "rand06-compat-v*"
      - "web-spawn-v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_VERSION: "1.95.0"

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse tag
        id: parse
        run: |
          tag="${GITHUB_REF_NAME}"
          crate="${tag%-v*}"
          version="${tag#${crate}-v}"
          echo "crate=${crate}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        run: |
          manifest_version=$(cargo metadata --format-version=1 --no-deps \
            | jq -r --arg name "${{ steps.parse.outputs.crate }}" \
                '.packages[] | select(.name == $name) | .version')
          if [ "$manifest_version" != "${{ steps.parse.outputs.version }}" ]; then
            echo "Tag version ${{ steps.parse.outputs.version }} does not match Cargo.toml version $manifest_version" >&2
            exit 1
          fi

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Use caching
        uses: Swatinem/rust-cache@v2.7.7

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p "${{ steps.parse.outputs.crate }}"
